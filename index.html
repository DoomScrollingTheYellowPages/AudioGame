<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AudioGame</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 24px;
    }

    .site-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: #333;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      max-width: 560px;
    }

    .nav-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #141414;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 28px 24px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, background 0.2s;
      cursor: pointer;
    }
    .nav-card:hover {
      border-color: #00ff88;
      background: #161f18;
    }
    .nav-card:hover .nav-icon { color: #00ff88; }
    .nav-card:hover .nav-label { color: #e0e0e0; }

    .nav-icon {
      font-size: 28px;
      color: #333;
      transition: color 0.2s;
      line-height: 1;
    }

    .nav-label {
      font-size: 13px;
      font-weight: bold;
      color: #888;
      letter-spacing: 1px;
      transition: color 0.2s;
    }

    .nav-desc {
      font-size: 10px;
      color: #444;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .nav-grid { grid-template-columns: 1fr; max-width: 300px; }
    }
  </style>
</head>
<body>

  <span class="site-title">AudioGame</span>

  <nav class="nav-grid">

    <a class="nav-card" href="./flashcard.html">
      <div class="nav-icon">♩</div>
      <div class="nav-label">Flashcard Game</div>
      <div class="nav-desc">Read notes on a staff.<br>Identify them by ear or keyboard.</div>
    </a>

    <a class="nav-card" href="./input-config.html">
      <div class="nav-icon">⚙</div>
      <div class="nav-label">Input Configuration</div>
      <div class="nav-desc">Configure microphone and MIDI device inputs.</div>
    </a>

  </nav>

</body>
</html>
