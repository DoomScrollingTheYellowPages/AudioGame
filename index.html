<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AudioGame</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 24px;
    }

    .site-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: #333;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      width: 100%;
      max-width: 720px;
    }

    .nav-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #141414;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 28px 24px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, background 0.2s;
      cursor: pointer;
    }
    .nav-card:hover {
      border-color: #00ff88;
      background: #161f18;
    }
    .nav-card:hover .nav-icon { color: #00ff88; }
    .nav-card:hover .nav-label { color: #e0e0e0; }

    .nav-icon {
      font-size: 28px;
      color: #333;
      transition: color 0.2s;
      line-height: 1;
    }

    .nav-label {
      font-size: 13px;
      font-weight: bold;
      color: #888;
      letter-spacing: 1px;
      transition: color 0.2s;
    }

    .nav-desc {
      font-size: 10px;
      color: #444;
      line-height: 1.5;
    }

    /* ── Device status bar ── */
    .device-status {
      width: 100%;
      max-width: 720px;
      display: flex;
      gap: 20px;
      justify-content: center;
      font-size: 10px;
      letter-spacing: 1px;
      color: #333;
    }
    .device-status .label { color: #444; }
    .device-status .value { color: #555; }
    .device-status .value.ok { color: #00ff88; }
    .device-status .value.err { color: #ff4444; }

    @media (max-width: 480px) {
      .nav-grid { grid-template-columns: 1fr; max-width: 320px; }
      .device-status { flex-direction: column; align-items: center; gap: 6px; }
    }
  </style>
</head>
<body>

  <span class="site-title">AudioGame</span>

  <nav class="nav-grid">

    <a class="nav-card" href="./flashcard.html">
      <div class="nav-icon">♩</div>
      <div class="nav-label">Flashcard Game</div>
      <div class="nav-desc">Read notes on a staff.<br>Identify them by ear or keyboard.</div>
    </a>

    <a class="nav-card" href="./rhythm.html">
      <div class="nav-icon">&#9835;</div>
      <div class="nav-label">Music Game</div>
      <div class="nav-desc">Guitar Hero-style.<br>Hit notes in time as they scroll.</div>
    </a>

    <a class="nav-card" href="./input-config.html">
      <div class="nav-icon">⚙</div>
      <div class="nav-label">Input Configuration</div>
      <div class="nav-desc">Configure microphone and MIDI device inputs.</div>
    </a>

  </nav>

  <div class="device-status">
    <span><span class="label">MIDI:</span> <span id="midi-info" class="value">checking…</span></span>
    <span><span class="label">Audio:</span> <span id="audio-info" class="value">checking…</span></span>
  </div>

  <script type="module">
    const midiEl  = document.getElementById('midi-info');
    const audioEl = document.getElementById('audio-info');

    // ── MIDI probe ──
    if (!navigator.requestMIDIAccess) {
      midiEl.textContent = 'not supported';
      midiEl.className = 'value err';
    } else {
      try {
        const access = await navigator.requestMIDIAccess({ sysex: false });
        const update = () => {
          const inputs = [...access.inputs.values()].filter(d => d.state === 'connected');
          if (inputs.length) {
            midiEl.textContent = inputs.map(d => d.name).join(', ');
            midiEl.className = 'value ok';
          } else {
            midiEl.textContent = 'no devices';
            midiEl.className = 'value';
          }
        };
        update();
        access.onstatechange = update;
      } catch {
        midiEl.textContent = 'access denied';
        midiEl.className = 'value err';
      }
    }

    // ── Audio probe ──
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const mics = devices.filter(d => d.kind === 'audioinput' && d.deviceId);
      if (mics.length) {
        const names = mics.map(d => d.label || 'Microphone').filter((v,i,a) => a.indexOf(v) === i);
        audioEl.textContent = names.join(', ');
        audioEl.className = 'value ok';
      } else {
        audioEl.textContent = 'no microphones';
        audioEl.className = 'value';
      }
    } catch {
      audioEl.textContent = 'access denied';
      audioEl.className = 'value err';
    }
  </script>

</body>
</html>
