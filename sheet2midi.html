<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sheet2MIDI — AudioGame</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      gap: 12px;
    }

    /* ── Header ── */
    .page-header {
      width: 100%;
      max-width: 800px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
    }

    .back-link {
      color: #555;
      text-decoration: none;
      font-size: 12px;
      border: 1px solid #222;
      border-radius: 4px;
      padding: 4px 10px;
      transition: color 0.2s, border-color 0.2s;
    }
    .back-link:hover { color: #00ff88; border-color: #00ff88; }

    .page-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #444;
    }

    /* ── Upload Area ── */
    .upload-area {
      width: 100%;
      max-width: 800px;
      border: 2px dashed #333;
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .upload-area:hover,
    .upload-area.drag-over {
      border-color: #00ff88;
      background: #0a1a10;
    }

    .upload-area h2 {
      font-size: 14px;
      color: #888;
      margin-bottom: 8px;
      font-weight: normal;
    }
    .upload-area p {
      font-size: 11px;
      color: #555;
    }

    #file-input { display: none; }

    /* ── Settings ── */
    .settings-row {
      width: 100%;
      max-width: 800px;
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    .setting-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .setting-group label {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .setting-group input,
    .setting-group select {
      background: #1a1a1a;
      color: #e0e0e0;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 4px 8px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      width: 70px;
    }

    .setting-group select { width: auto; }

    /* ── Process Button ── */
    #process-btn {
      background: #1a1a1a;
      color: #00ff88;
      border: 1px solid #00ff88;
      border-radius: 4px;
      padding: 8px 24px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #process-btn:hover { background: #0a2a18; }
    #process-btn:disabled {
      color: #333;
      border-color: #222;
      cursor: default;
      background: #1a1a1a;
    }

    /* ── Progress ── */
    .progress-area {
      width: 100%;
      max-width: 800px;
      display: none;
    }
    .progress-area.active { display: block; }

    .progress-bar-track {
      width: 100%;
      height: 4px;
      background: #1a1a1a;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-bar-fill {
      height: 100%;
      background: #00ff88;
      width: 0%;
      transition: width 0.3s ease;
    }

    #progress-text {
      font-size: 11px;
      color: #555;
    }

    /* ── Preview ── */
    .preview-area {
      width: 100%;
      max-width: 800px;
      display: none;
    }
    .preview-area.active { display: block; }

    .preview-section {
      margin-bottom: 16px;
    }

    .preview-section h3 {
      font-size: 11px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    #preview-canvas {
      max-width: 100%;
      height: auto;
      border: 1px solid #222;
      border-radius: 4px;
      background: #fff;
    }

    /* ── Results ── */
    .results-area {
      width: 100%;
      max-width: 800px;
      display: none;
    }
    .results-area.active { display: block; }

    .result-stats {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .stat-box {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 12px 16px;
      min-width: 100px;
    }

    .stat-value {
      font-size: 20px;
      color: #00ff88;
      margin-bottom: 2px;
    }

    .stat-label {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #download-btn {
      background: #00ff88;
      color: #0d0d0d;
      border: none;
      border-radius: 4px;
      padding: 10px 32px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: opacity 0.2s;
    }
    #download-btn:hover { opacity: 0.85; }

    /* ── Corrections Log ── */
    .corrections-log {
      margin-top: 16px;
      padding: 12px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      font-size: 11px;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }
    .corrections-log.active { display: block; }

    .corrections-log h4 {
      color: #ccaa22;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .corrections-log p {
      color: #888;
      margin-bottom: 4px;
    }

    /* ── Page Selector ── */
    .page-selector {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }
    .page-selector.active { display: flex; }

    .page-nav-btn {
      background: #1a1a1a;
      color: #e0e0e0;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 4px 10px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .page-nav-btn:hover { border-color: #00ff88; color: #00ff88; }
    .page-nav-btn:disabled { color: #333; border-color: #1a1a1a; cursor: default; }

    #page-label {
      font-size: 11px;
      color: #666;
      min-width: 80px;
      text-align: center;
    }

    /* ── Error ── */
    .error-msg {
      width: 100%;
      max-width: 800px;
      background: #1a0a0a;
      border: 1px solid #ff4444;
      border-radius: 4px;
      padding: 12px;
      color: #ff4444;
      font-size: 12px;
      display: none;
    }
    .error-msg.active { display: block; }
  </style>
</head>
<body>

  <div class="page-header">
    <a href="index.html" class="back-link">&#8592; Back</a>
    <span class="page-title">Sheet2MIDI</span>
    <span></span>
  </div>

  <!-- Upload -->
  <div class="upload-area" id="upload-area">
    <h2>Drop sheet music here</h2>
    <p>PNG, JPG, BMP, or PDF &mdash; clean printed scores work best</p>
    <input type="file" id="file-input" accept="image/png,image/jpeg,image/bmp,application/pdf" />
  </div>

  <!-- Settings -->
  <div class="settings-row">
    <div class="setting-group">
      <label for="bpm-input">BPM</label>
      <input type="number" id="bpm-input" value="120" min="20" max="300" />
    </div>
    <div class="setting-group">
      <label for="time-sig">Time Sig</label>
      <select id="time-sig">
        <option value="4/4" selected>4/4</option>
        <option value="3/4">3/4</option>
        <option value="2/4">2/4</option>
        <option value="6/8">6/8</option>
        <option value="2/2">2/2</option>
      </select>
    </div>
    <button id="process-btn" disabled>Process</button>
  </div>

  <!-- Progress -->
  <div class="progress-area" id="progress-area">
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
    <span id="progress-text">Initializing...</span>
  </div>

  <!-- Preview -->
  <div class="preview-area" id="preview-area">
    <div class="preview-section">
      <h3>Source Image</h3>
      <canvas id="preview-canvas"></canvas>
      <div class="page-selector" id="page-selector">
        <button class="page-nav-btn" id="prev-page">&#9664;</button>
        <span id="page-label">Page 1 / 1</span>
        <button class="page-nav-btn" id="next-page">&#9654;</button>
      </div>
    </div>
  </div>

  <!-- Results -->
  <div class="results-area" id="results-area">
    <div class="result-stats">
      <div class="stat-box">
        <div class="stat-value" id="stat-notes">0</div>
        <div class="stat-label">Notes</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="stat-staves">0</div>
        <div class="stat-label">Staves</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="stat-measures">0</div>
        <div class="stat-label">Measures</div>
      </div>
    </div>
    <button id="download-btn">Download MIDI</button>
    <div class="corrections-log" id="corrections-log">
      <h4>Corrections &amp; Warnings</h4>
      <div id="corrections-list"></div>
    </div>
  </div>

  <!-- Error -->
  <div class="error-msg" id="error-msg"></div>

  <script type="module" src="src/sheet2midi-main.js"></script>
</body>
</html>
