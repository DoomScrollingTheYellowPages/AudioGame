<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sheet2MIDI — AudioGame</title>
  <script>
    (function() {
      var t = localStorage.getItem('audiogame-theme');
      if (t !== 'dark' && t !== 'warm' && t !== 'clean') t = 'dark';
      document.documentElement.className = 'theme-' + t;
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .theme-dark {
      --bg: #0d0d0d; --text: #e0e0e0; --accent: #00ff88; --error: #ff4444;
      --control-bg: #1a1a1a; --control-border: #2a2a2a;
      --font: 'Courier New', monospace;
      --perfect: #00ff88; --great: #88cc44; --good: #ccaa22; --miss: #ff4444;
      --dim: #333; --dim2: #444; --dim3: #555; --mid: #888;
      --card-bg: #141414; --card-border: #222; --card-hover-bg: #161f18;
    }
    .theme-warm {
      --bg: #faf5ef; --text: #3a3330; --accent: #e8863a; --error: #d94444;
      --control-bg: #f0e8df; --control-border: #d9cfc3;
      --font: 'Nunito', 'Segoe UI', sans-serif;
      --perfect: #4caf50; --great: #8bc34a; --good: #ffc107; --miss: #d94444;
      --dim: #bfb3a4; --dim2: #a89888; --dim3: #8a7d70; --mid: #6b5f53;
      --card-bg: #f0e8df; --card-border: #d9cfc3; --card-hover-bg: #e8dfd4;
    }
    .theme-clean {
      --bg: #ffffff; --text: #212121; --accent: #1976d2; --error: #c62828;
      --control-bg: #f5f5f5; --control-border: #e0e0e0;
      --font: 'Inter', 'Helvetica Neue', sans-serif;
      --perfect: #1976d2; --great: #42a5f5; --good: #ffa726; --miss: #c62828;
      --dim: #bdbdbd; --dim2: #9e9e9e; --dim3: #757575; --mid: #616161;
      --card-bg: #f5f5f5; --card-border: #e0e0e0; --card-hover-bg: #eeeeee;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      gap: 12px;
    }

    /* ── Header ── */
    .page-header {
      width: 100%;
      max-width: 800px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
    }

    .back-link {
      color: var(--dim3);
      text-decoration: none;
      font-size: 12px;
      border: 1px solid var(--card-border);
      border-radius: 4px;
      padding: 4px 10px;
      transition: color 0.2s, border-color 0.2s;
    }
    .back-link:hover { color: var(--accent); border-color: var(--accent); }

    .page-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--dim2);
    }

    /* ── Upload Area ── */
    .upload-area {
      width: 100%;
      max-width: 800px;
      border: 2px dashed var(--dim);
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .upload-area:hover,
    .upload-area.drag-over {
      border-color: var(--accent);
      background: var(--card-hover-bg);
    }

    .upload-area h2 {
      font-size: 14px;
      color: var(--mid);
      margin-bottom: 8px;
      font-weight: normal;
    }
    .upload-area p {
      font-size: 11px;
      color: var(--dim3);
    }

    #file-input { display: none; }

    /* ── Settings ── */
    .settings-row {
      width: 100%;
      max-width: 800px;
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    .setting-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .setting-group label {
      font-size: 11px;
      color: var(--mid);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .setting-group input,
    .setting-group select {
      background: var(--control-bg);
      color: var(--text);
      border: 1px solid var(--control-border);
      border-radius: 4px;
      padding: 4px 8px;
      font-family: var(--font);
      font-size: 12px;
      width: 70px;
    }

    .setting-group select { width: auto; }

    /* ── Process Button ── */
    #process-btn {
      background: var(--control-bg);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 8px 24px;
      font-family: var(--font);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #process-btn:hover { background: var(--card-hover-bg); }
    #process-btn:disabled {
      color: var(--dim);
      border-color: var(--card-border);
      cursor: default;
      background: var(--control-bg);
    }

    /* ── Progress ── */
    .progress-area {
      width: 100%;
      max-width: 800px;
      display: none;
    }
    .progress-area.active { display: block; }

    .progress-bar-track {
      width: 100%;
      height: 4px;
      background: var(--control-bg);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }

    #progress-text {
      font-size: 11px;
      color: var(--dim3);
    }

    /* ── Preview ── */
    .preview-area {
      width: 100%;
      max-width: 800px;
      display: none;
    }
    .preview-area.active { display: block; }

    .preview-section {
      margin-bottom: 16px;
    }

    .preview-section h3 {
      font-size: 11px;
      color: var(--dim3);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    #preview-canvas {
      max-width: 100%;
      height: auto;
      border: 1px solid var(--card-border);
      border-radius: 4px;
      background: #fff;
    }

    /* ── Results ── */
    .results-area {
      width: 100%;
      max-width: 800px;
      display: none;
    }
    .results-area.active { display: block; }

    .result-stats {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .stat-box {
      background: var(--control-bg);
      border: 1px solid var(--control-border);
      border-radius: 4px;
      padding: 12px 16px;
      min-width: 100px;
    }

    .stat-value {
      font-size: 20px;
      color: var(--accent);
      margin-bottom: 2px;
    }

    .stat-label {
      font-size: 10px;
      color: var(--dim3);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #download-btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 4px;
      padding: 10px 32px;
      font-family: var(--font);
      font-size: 13px;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: opacity 0.2s;
    }
    #download-btn:hover { opacity: 0.85; }

    /* ── Corrections Log ── */
    .corrections-log {
      margin-top: 16px;
      padding: 12px;
      background: var(--control-bg);
      border: 1px solid var(--control-border);
      border-radius: 4px;
      font-size: 11px;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }
    .corrections-log.active { display: block; }

    .corrections-log h4 {
      color: var(--good);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .corrections-log p {
      color: var(--mid);
      margin-bottom: 4px;
    }

    /* ── Page Selector ── */
    .page-selector {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }
    .page-selector.active { display: flex; }

    .page-nav-btn {
      background: var(--control-bg);
      color: var(--text);
      border: 1px solid var(--control-border);
      border-radius: 4px;
      padding: 4px 10px;
      font-family: var(--font);
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .page-nav-btn:hover { border-color: var(--accent); color: var(--accent); }
    .page-nav-btn:disabled { color: var(--dim); border-color: var(--control-bg); cursor: default; }

    #page-label {
      font-size: 11px;
      color: var(--mid);
      min-width: 80px;
      text-align: center;
    }

    /* ── Error ── */
    .error-msg {
      width: 100%;
      max-width: 800px;
      background: #1a0a0a;
      border: 1px solid var(--error);
      border-radius: 4px;
      padding: 12px;
      color: var(--error);
      font-size: 12px;
      display: none;
    }
    .error-msg.active { display: block; }

    /* ── Debug Panel ── */
    .debug-panel {
      width: 100%;
      max-width: 800px;
      display: none;
    }
    .debug-panel.active { display: block; }

    .debug-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .debug-header label {
      font-size: 11px;
      color: var(--mid);
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #debug-toggle {
      accent-color: var(--accent);
    }

    #load-test-btn {
      background: var(--control-bg);
      color: var(--good);
      border: 1px solid var(--good);
      border-radius: 4px;
      padding: 4px 12px;
      font-family: var(--font);
      font-size: 11px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: none;
    }
    #load-test-btn:hover { opacity: 0.8; }

    .debug-results {
      display: none;
      background: var(--control-bg);
      border: 1px solid var(--control-border);
      border-radius: 4px;
      padding: 12px;
      font-size: 11px;
      max-height: 500px;
      overflow-y: auto;
    }
    .debug-results.active { display: block; }

    .debug-results h4 {
      color: var(--accent);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 12px 0 6px 0;
    }
    .debug-results h4:first-child { margin-top: 0; }

    .debug-results table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 8px;
    }

    .debug-results th {
      text-align: left;
      color: var(--dim3);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 2px 6px;
      border-bottom: 1px solid var(--control-border);
    }

    .debug-results td {
      padding: 2px 6px;
      color: var(--text);
      border-bottom: 1px solid var(--card-border);
    }

    .debug-results .match { color: var(--perfect); }
    .debug-results .mismatch { color: var(--error); }

    .debug-expected {
      color: var(--dim3);
      font-size: 10px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div class="page-header">
    <a href="index.html" class="back-link">&#8592; Back</a>
    <span class="page-title">Sheet2MIDI</span>
    <span></span>
  </div>

  <!-- Upload -->
  <div class="upload-area" id="upload-area">
    <h2>Drop sheet music here</h2>
    <p>PNG, JPG, BMP, or PDF &mdash; drop, click, or paste (Ctrl+V)</p>
    <input type="file" id="file-input" accept="image/png,image/jpeg,image/bmp,application/pdf" />
  </div>

  <!-- Settings -->
  <div class="settings-row">
    <div class="setting-group">
      <label for="bpm-input">BPM</label>
      <input type="number" id="bpm-input" value="120" min="20" max="300" />
    </div>
    <div class="setting-group">
      <label for="time-sig">Time Sig</label>
      <select id="time-sig">
        <option value="4/4" selected>4/4</option>
        <option value="3/4">3/4</option>
        <option value="2/4">2/4</option>
        <option value="6/8">6/8</option>
        <option value="2/2">2/2</option>
      </select>
    </div>
    <button id="process-btn" disabled>Process</button>
  </div>

  <!-- Progress -->
  <div class="progress-area" id="progress-area">
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
    <span id="progress-text">Initializing...</span>
  </div>

  <!-- Preview -->
  <div class="preview-area" id="preview-area">
    <div class="preview-section">
      <h3>Source Image</h3>
      <canvas id="preview-canvas"></canvas>
      <div class="page-selector" id="page-selector">
        <button class="page-nav-btn" id="prev-page">&#9664;</button>
        <span id="page-label">Page 1 / 1</span>
        <button class="page-nav-btn" id="next-page">&#9654;</button>
      </div>
    </div>
  </div>

  <!-- Results -->
  <div class="results-area" id="results-area">
    <div class="result-stats">
      <div class="stat-box">
        <div class="stat-value" id="stat-notes">0</div>
        <div class="stat-label">Notes</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="stat-staves">0</div>
        <div class="stat-label">Staves</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="stat-measures">0</div>
        <div class="stat-label">Measures</div>
      </div>
    </div>
    <button id="download-btn">Download MIDI</button>
    <div class="corrections-log" id="corrections-log">
      <h4>Corrections &amp; Warnings</h4>
      <div id="corrections-list"></div>
    </div>
  </div>

  <!-- Error -->
  <div class="error-msg" id="error-msg"></div>

  <!-- Debug Panel -->
  <div class="debug-panel active" id="debug-panel">
    <div class="debug-header">
      <label>
        <input type="checkbox" id="debug-toggle" />
        Debug Mode
      </label>
      <button id="load-test-btn">Load Test Image</button>
    </div>
    <div class="debug-results" id="debug-results">
      <div id="debug-content"></div>
    </div>
  </div>

  <script type="module" src="src/sheet2midi-main.js"></script>
</body>
</html>
