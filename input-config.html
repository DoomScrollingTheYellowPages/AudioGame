<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Input Configuration — AudioGame</title>
  <script>
    (function() {
      var t = localStorage.getItem('audiogame-theme');
      if (t !== 'dark' && t !== 'warm' && t !== 'clean') t = 'dark';
      document.documentElement.className = 'theme-' + t;
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .theme-dark {
      --bg: #0d0d0d; --text: #e0e0e0; --accent: #00ff88; --error: #ff4444;
      --control-bg: #1a1a1a; --control-border: #2a2a2a;
      --font: 'Courier New', monospace;
      --perfect: #00ff88; --great: #88cc44; --good: #ccaa22; --miss: #ff4444;
      --dim: #333; --dim2: #444; --dim3: #555; --mid: #888;
      --card-bg: #141414; --card-border: #222; --card-hover-bg: #161f18;
    }
    .theme-warm {
      --bg: #faf5ef; --text: #3a3330; --accent: #e8863a; --error: #d94444;
      --control-bg: #f0e8df; --control-border: #d9cfc3;
      --font: 'Nunito', 'Segoe UI', sans-serif;
      --perfect: #4caf50; --great: #8bc34a; --good: #ffc107; --miss: #d94444;
      --dim: #bfb3a4; --dim2: #a89888; --dim3: #8a7d70; --mid: #6b5f53;
      --card-bg: #f0e8df; --card-border: #d9cfc3; --card-hover-bg: #e8dfd4;
    }
    .theme-clean {
      --bg: #ffffff; --text: #212121; --accent: #1976d2; --error: #c62828;
      --control-bg: #f5f5f5; --control-border: #e0e0e0;
      --font: 'Inter', 'Helvetica Neue', sans-serif;
      --perfect: #1976d2; --great: #42a5f5; --good: #ffa726; --miss: #c62828;
      --dim: #bdbdbd; --dim2: #9e9e9e; --dim3: #757575; --mid: #616161;
      --card-bg: #f5f5f5; --card-border: #e0e0e0; --card-hover-bg: #eeeeee;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
    }

    .page-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-link {
      color: var(--dim3);
      text-decoration: none;
      font-size: 12px;
      border: 1px solid var(--card-border);
      border-radius: 4px;
      padding: 4px 10px;
      transition: color 0.2s, border-color 0.2s;
    }
    .back-link:hover { color: var(--accent); border-color: var(--accent); }

    .page-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--dim3);
    }

    h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--dim3);
      margin-bottom: 8px;
    }

    /* ── Layout ── */
    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      flex: 1;
      min-height: 0;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* ── Audio panel ── */
    #start-audio {
      background: var(--control-bg);
      border: 1px solid var(--dim);
      color: var(--mid);
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      width: fit-content;
      margin-bottom: 10px;
      transition: border-color 0.2s, color 0.2s;
    }
    #start-audio:hover { border-color: var(--accent); color: var(--accent); }
    #start-audio.active { border-color: var(--accent); color: var(--accent); }

    .audio-meta {
      display: flex;
      gap: 16px;
      margin-top: 8px;
      color: var(--dim2);
      font-size: 11px;
    }
    .audio-meta span { color: var(--accent); }

    /* ── MIDI panel ── */
    .midi-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    #midi-device-select {
      background: var(--control-bg);
      border: 1px solid var(--dim);
      color: var(--mid);
      padding: 4px 8px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 12px;
      flex: 1;
    }

    .midi-status {
      font-size: 11px;
      color: var(--dim3);
    }
    .midi-status.ok  { color: var(--accent); }
    .midi-status.err { color: var(--error); }

    /* Mini keyboard */
    .keyboard-wrap {
      position: relative;
      height: 60px;
      margin-bottom: 10px;
      overflow: hidden;
      border-radius: 3px;
      background: var(--bg);
      border: 1px solid var(--control-border);
    }

    /* CC bars */
    .cc-section { margin-bottom: 8px; }
    .cc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 4px;
      max-height: 60px;
      overflow-y: auto;
    }
    .cc-bar-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .cc-label {
      font-size: 9px;
      color: var(--dim3);
      display: flex;
      justify-content: space-between;
    }
    .cc-label .cc-val { color: var(--mid); }
    .cc-track {
      height: 4px;
      background: var(--control-border);
      border-radius: 2px;
      overflow: hidden;
    }
    .cc-fill {
      height: 100%;
      background: #4488ff;
      border-radius: 2px;
      transition: width 0.05s;
    }

    /* Message log */
    .log-wrap {
      flex: 1;
      overflow-y: auto;
      background: var(--bg);
      border: 1px solid var(--control-border);
      border-radius: 3px;
      padding: 6px;
      min-height: 0;
    }
    .log-wrap::-webkit-scrollbar { width: 4px; }
    .log-wrap::-webkit-scrollbar-track { background: transparent; }
    .log-wrap::-webkit-scrollbar-thumb { background: var(--control-border); border-radius: 2px; }

    .log-entry {
      display: flex;
      gap: 8px;
      padding: 2px 0;
      border-bottom: 1px solid #111;
      font-size: 11px;
      animation: fadeIn 0.1s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; } }

    .log-time { color: var(--dim); min-width: 48px; }
    .log-type { min-width: 60px; font-weight: bold; }
    .log-type.note-on  { color: var(--accent); }
    .log-type.note-off { color: #ff6644; }
    .log-type.cc       { color: #4488ff; }
    .log-type.other    { color: var(--mid); }
    .log-body { color: #ccc; }

    /* ── Tuner ── */
    .tuner {
      border-top: 1px solid var(--control-border);
      margin-top: 8px;
      padding-top: 10px;
    }

    .tuner-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tuner-note {
      font-size: 22px;
      font-weight: bold;
      min-width: 42px;
      text-align: center;
      color: var(--dim2);
      letter-spacing: 1px;
      transition: color 0.1s;
    }

    .tuner-meter-area {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tuner-acc {
      font-size: 12px;
      color: var(--dim);
      user-select: none;
    }

    .tuner-track {
      flex: 1;
      height: 14px;
      background: var(--bg);
      border: 1px solid var(--control-border);
      border-radius: 7px;
      position: relative;
      overflow: hidden;
    }

    .tuner-center-mark {
      position: absolute;
      left: 50%;
      top: 2px;
      bottom: 2px;
      width: 1px;
      background: var(--control-border);
      transform: translateX(-50%);
    }

    .tuner-needle {
      position: absolute;
      top: 2px;
      bottom: 2px;
      width: 4px;
      background: var(--control-border);
      border-radius: 2px;
      transform: translateX(-50%);
      left: 50%;
      transition: left 0.08s ease, background 0.1s;
    }

    .tuner-freq {
      font-size: 10px;
      color: var(--dim3);
      min-width: 58px;
      text-align: right;
    }

    .tuner-cents {
      text-align: center;
      font-size: 10px;
      color: var(--dim);
      margin-top: 4px;
      letter-spacing: 1px;
      transition: color 0.1s;
    }

    @media (max-width: 600px) {
      .panels { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="page-header">
    <a class="back-link" href="./index.html">← Back</a>
    <span class="page-title">Input Configuration</span>
  </div>

  <div class="panels">

    <!-- ── Audio Panel ── -->
    <div class="panel" id="audio-panel">
      <h2>Audio Input</h2>
      <button id="start-audio">Enable Microphone</button>
      <!-- Oscilloscope canvas + meta are mounted here by Oscilloscope.js -->
      <!-- Tuner is mounted here by Tuner.js -->
      <div id="tuner-wrap"></div>
    </div>

    <!-- ── MIDI Panel ── -->
    <div class="panel">
      <h2>MIDI Input</h2>

      <div class="midi-header">
        <select id="midi-device-select"><option>— no devices —</option></select>
        <span class="midi-status" id="midi-status">not connected</span>
      </div>

      <div class="keyboard-wrap" id="keyboard-wrap">
        <!-- KeyboardDisplay canvas mounted here -->
      </div>

      <div class="cc-section">
        <h2>CC</h2>
        <div class="cc-grid" id="cc-grid">
          <!-- CCDisplay bars appear here dynamically -->
        </div>
      </div>

      <h2 style="margin-top:8px">Messages</h2>
      <div class="log-wrap" id="midi-log">
        <!-- MIDILog entries prepended here -->
      </div>
    </div>

  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
