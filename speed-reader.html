<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speed Reader — AudioGame</title>
  <script>
    (function() {
      var t = localStorage.getItem('audiogame-theme');
      if (t !== 'dark' && t !== 'warm' && t !== 'clean') t = 'dark';
      document.documentElement.className = 'theme-' + t;
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .theme-dark {
      --bg: #0d0d0d; --text: #e0e0e0; --accent: #00ff88; --error: #ff4444;
      --control-bg: #1a1a1a; --control-border: #2a2a2a;
      --font: 'Courier New', monospace;
      --perfect: #00ff88; --great: #88cc44; --good: #ccaa22; --miss: #ff4444;
      --dim: #333; --dim2: #444; --dim3: #555; --mid: #888;
      --card-bg: #141414; --card-border: #222; --card-hover-bg: #161f18;
    }
    .theme-warm {
      --bg: #faf5ef; --text: #3a3330; --accent: #e8863a; --error: #d94444;
      --control-bg: #f0e8df; --control-border: #d9cfc3;
      --font: 'Nunito', 'Segoe UI', sans-serif;
      --perfect: #4caf50; --great: #8bc34a; --good: #ffc107; --miss: #d94444;
      --dim: #bfb3a4; --dim2: #a89888; --dim3: #8a7d70; --mid: #6b5f53;
      --card-bg: #f0e8df; --card-border: #d9cfc3; --card-hover-bg: #e8dfd4;
    }
    .theme-clean {
      --bg: #ffffff; --text: #212121; --accent: #1976d2; --error: #c62828;
      --control-bg: #f5f5f5; --control-border: #e0e0e0;
      --font: 'Inter', 'Helvetica Neue', sans-serif;
      --perfect: #1976d2; --great: #42a5f5; --good: #ffa726; --miss: #c62828;
      --dim: #bdbdbd; --dim2: #9e9e9e; --dim3: #757575; --mid: #616161;
      --card-bg: #f5f5f5; --card-border: #e0e0e0; --card-hover-bg: #eeeeee;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    /* ── Header ── */
    .page-header {
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
    }

    .back-link {
      color: var(--dim3);
      text-decoration: none;
      font-size: 12px;
      border: 1px solid var(--card-border);
      border-radius: 4px;
      padding: 4px 10px;
      transition: color 0.2s, border-color 0.2s;
    }
    .back-link:hover { color: var(--accent); border-color: var(--accent); }

    .page-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--dim2);
    }

    .input-status {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    #midi-status {
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 1px;
    }
    #midi-status[data-state="ok"] { color: var(--accent); }
    #midi-status[data-state="err"] { color: var(--error); }

    #midi-device-select {
      background: var(--control-bg);
      border: 1px solid var(--control-border);
      color: var(--mid);
      font-family: inherit;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      max-width: 140px;
    }

    /* ── Stats bar ── */
    .stats-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      padding-bottom: 16px;
      align-items: flex-end;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      padding: 0 8px;
      border-right: 1px solid var(--control-bg);
    }
    .stat:last-child { border-right: none; }

    .stat-value {
      font-size: 22px;
      font-weight: bold;
      color: var(--text);
      line-height: 1.1;
    }
    .stat-value.big { font-size: 34px; color: var(--accent); }

    .stat-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--dim);
      margin-top: 3px;
    }

    /* ── Staff canvas ── */
    .staff-wrap {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    #staff-canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ── Feedback (note name flash) ── */
    #feedback {
      height: 36px;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
      color: var(--dim2);
      margin-bottom: 6px;
      text-align: center;
      transition: color 0.08s;
      line-height: 36px;
    }
    #feedback[data-state="correct"] { color: var(--accent); }
    #feedback[data-state="wrong"]   { color: var(--error); }

    /* ── Streak ── */
    #streak-display {
      font-size: 11px;
      color: var(--dim2);
      text-align: center;
      margin-bottom: 14px;
      letter-spacing: 1px;
    }

    /* ── Note buttons ── */
    .prompt {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--dim);
      margin-bottom: 12px;
      text-align: center;
    }

    .note-buttons {
      position: relative;
      display: flex;
      gap: 3px;
      width: 100%;
      max-width: 420px;
      height: 80px;
      margin: 0 auto 10px;
    }

    .note-btn {
      flex: 1;
      background: var(--control-bg);
      border: 1px solid var(--control-border);
      color: var(--mid);
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      border-radius: 0 0 6px 6px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
    }
    .note-btn[data-black="true"] {
      position: absolute;
      top: 0;
      width: 12%;
      height: 55%;
      background: var(--bg);
      border: 1px solid var(--control-border);
      color: var(--dim3);
      font-size: 11px;
      border-radius: 0 0 4px 4px;
      z-index: 1;
      align-items: flex-end;
      padding-bottom: 4px;
    }
    .note-btn[data-note="C#"] { left: 8.5%;  }
    .note-btn[data-note="D#"] { left: 22.5%; }
    .note-btn[data-note="F#"] { left: 51%;   }
    .note-btn[data-note="G#"] { left: 65%;   }
    .note-btn[data-note="A#"] { left: 79.5%; }
    .note-btn:hover  { border-color: var(--accent); color: var(--accent); background: var(--card-hover-bg); }
    .note-btn:active { background: var(--card-hover-bg); }

    .keyboard-hint {
      font-size: 9px;
      color: var(--dim);
      text-align: center;
      letter-spacing: 1px;
    }

    .input-config-link {
      color: var(--dim2);
      text-decoration: none;
      font-size: 10px;
      border: 1px solid var(--card-border);
      border-radius: 4px;
      padding: 3px 8px;
      letter-spacing: 1px;
      transition: color 0.2s, border-color 0.2s;
    }
    .input-config-link:hover { color: var(--accent); border-color: var(--accent); }

    /* ── Representation select ── */
    .repr-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
    }
    .repr-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--dim);
    }
    #repr-select {
      background: var(--control-bg);
      border: 1px solid var(--control-border);
      color: var(--mid);
      font-family: inherit;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header class="page-header">
    <a class="back-link" href="./index.html">← Back</a>
    <span class="page-title">Speed Reader</span>
    <div class="input-status">
      <span id="midi-status">MIDI —</span>
      <select id="midi-device-select"><option>— no devices —</option></select>
      <a class="input-config-link" href="./input-config.html">⚙</a>
    </div>
  </header>

  <!-- ── Stats ── -->
  <div class="stats-bar">
    <div class="stat">
      <span class="stat-value big" id="npm">—</span>
      <span class="stat-label">notes/min</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="notes-count">0</span>
      <span class="stat-label">notes</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="accuracy">100%</span>
      <span class="stat-label">accuracy</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="timer">0:00</span>
      <span class="stat-label">time</span>
    </div>
  </div>

  <!-- ── Controls ── -->
  <div class="repr-bar">
    <span class="repr-label">Clef:</span>
    <select id="clef-select">
      <option value="treble">Treble</option>
      <option value="bass">Bass</option>
      <option value="both">Both</option>
    </select>
    <span class="repr-label" style="margin-left:12px">View:</span>
    <select id="repr-select">
      <option value="staff">Staff Notation</option>
      <option value="fingering">Oboe Fingering</option>
    </select>
  </div>

  <!-- ── Staff ── -->
  <div class="staff-wrap">
    <canvas id="staff-canvas" width="560" height="200"></canvas>
  </div>

  <!-- ── Feedback ── -->
  <div id="feedback" data-state=""></div>

  <!-- ── Streak ── -->
  <div id="streak-display">streak  0</div>

  <!-- ── Note buttons ── -->
  <p class="prompt">Play on MIDI keyboard · sing/play into mic · or click a note</p>
  <div class="note-buttons">
    <button class="note-btn" data-note="C">C</button>
    <button class="note-btn" data-note="C#" data-black="true">C&#9839;</button>
    <button class="note-btn" data-note="D">D</button>
    <button class="note-btn" data-note="D#" data-black="true">D&#9839;</button>
    <button class="note-btn" data-note="E">E</button>
    <button class="note-btn" data-note="F">F</button>
    <button class="note-btn" data-note="F#" data-black="true">F&#9839;</button>
    <button class="note-btn" data-note="G">G</button>
    <button class="note-btn" data-note="G#" data-black="true">G&#9839;</button>
    <button class="note-btn" data-note="A">A</button>
    <button class="note-btn" data-note="A#" data-black="true">A&#9839;</button>
    <button class="note-btn" data-note="B">B</button>
  </div>
  <p class="keyboard-hint">white: a s d f g h j &nbsp;&nbsp; black: w e t y u</p>

  <script type="module" src="./src/speed-reader-main.js"></script>
</body>
</html>
