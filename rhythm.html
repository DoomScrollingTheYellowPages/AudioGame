<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MidiHero — AudioGame</title>
  <script>
    (function() {
      var t = localStorage.getItem('audiogame-theme');
      if (t !== 'dark' && t !== 'warm' && t !== 'clean') t = 'dark';
      document.documentElement.className = 'theme-' + t;
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .theme-dark {
      --bg: #0d0d0d; --text: #e0e0e0; --accent: #00ff88; --error: #ff4444;
      --control-bg: #1a1a1a; --control-border: #2a2a2a;
      --font: 'Courier New', monospace;
      --perfect: #00ff88; --great: #88cc44; --good: #ccaa22; --miss: #ff4444;
      --dim: #333; --dim2: #444; --dim3: #555; --mid: #888;
      --card-bg: #141414; --card-border: #222; --card-hover-bg: #161f18;
    }
    .theme-warm {
      --bg: #faf5ef; --text: #3a3330; --accent: #e8863a; --error: #d94444;
      --control-bg: #f0e8df; --control-border: #d9cfc3;
      --font: 'Nunito', 'Segoe UI', sans-serif;
      --perfect: #4caf50; --great: #8bc34a; --good: #ffc107; --miss: #d94444;
      --dim: #bfb3a4; --dim2: #a89888; --dim3: #8a7d70; --mid: #6b5f53;
      --card-bg: #f0e8df; --card-border: #d9cfc3; --card-hover-bg: #e8dfd4;
    }
    .theme-clean {
      --bg: #ffffff; --text: #212121; --accent: #1976d2; --error: #c62828;
      --control-bg: #f5f5f5; --control-border: #e0e0e0;
      --font: 'Inter', 'Helvetica Neue', sans-serif;
      --perfect: #1976d2; --great: #42a5f5; --good: #ffa726; --miss: #c62828;
      --dim: #bdbdbd; --dim2: #9e9e9e; --dim3: #757575; --mid: #616161;
      --card-bg: #f5f5f5; --card-border: #e0e0e0; --card-hover-bg: #eeeeee;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      gap: 0;
    }

    /* ── Header ── */
    .page-header {
      width: 100%;
      max-width: 800px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
    }

    .back-link {
      color: var(--dim3);
      text-decoration: none;
      font-size: 12px;
      border: 1px solid var(--card-border);
      border-radius: 4px;
      padding: 4px 10px;
      transition: color 0.2s, border-color 0.2s;
    }
    .back-link:hover { color: var(--accent); border-color: var(--accent); }

    .page-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--dim2);
    }

    .input-status {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #midi-status {
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 1px;
    }
    #midi-status[data-state="ok"] { color: var(--accent); }
    #midi-status[data-state="err"] { color: var(--error); }

    #midi-device-select {
      background: var(--control-bg);
      border: 1px solid var(--control-border);
      color: var(--mid);
      font-family: inherit;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      max-width: 140px;
    }

    /* ── Song info bar ── */
    .song-bar {
      width: 100%;
      max-width: 800px;
      display: flex;
      gap: 20px;
      align-items: center;
      padding-bottom: 12px;
      font-size: 11px;
      color: var(--dim3);
    }
    .song-bar .song-name { color: var(--mid); font-weight: bold; }
    .song-bar .bpm { color: var(--dim3); }

    #song-select {
      background: var(--control-bg);
      border: 1px solid var(--control-border);
      color: var(--mid);
      font-family: inherit;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .bar-sep { color: var(--control-border); }

    /* ── View select ── */
    .view-select-wrap {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .view-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--dim);
    }
    #view-select {
      background: var(--control-bg);
      border: 1px solid var(--control-border);
      color: var(--mid);
      font-family: inherit;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    .input-config-link {
      color: var(--dim2);
      text-decoration: none;
      font-size: 10px;
      border: 1px solid var(--card-border);
      border-radius: 4px;
      padding: 3px 8px;
      letter-spacing: 1px;
      transition: color 0.2s, border-color 0.2s;
    }
    .input-config-link:hover { color: var(--accent); border-color: var(--accent); }

    .midi-upload-label {
      color: var(--dim3);
      cursor: pointer;
      font-size: 11px;
      border: 1px solid var(--control-border);
      padding: 2px 8px;
      border-radius: 4px;
      transition: color 0.2s, border-color 0.2s;
    }
    .midi-upload-label:hover { color: var(--accent); border-color: var(--accent); }

    .midi-file-name {
      color: var(--accent);
      font-size: 10px;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #midi-track-select {
      display: none;
      background: var(--control-bg);
      border: 1px solid var(--control-border);
      color: var(--accent);
      font-family: inherit;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      max-width: 140px;
    }
    #midi-track-select.visible { display: inline-block; }

    /* ── Playback controls ── */
    .playback-bar {
      width: 100%;
      max-width: 800px;
      display: flex;
      gap: 20px;
      align-items: center;
      padding-bottom: 10px;
      font-size: 10px;
      color: var(--dim3);
      letter-spacing: 1px;
    }

    .playback-bar label {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .vol-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 80px;
      height: 4px;
      background: var(--control-border);
      border-radius: 2px;
      outline: none;
    }
    .vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }
    .vol-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
    }

    /* ── Rotary dial (metronome) ── */
    .dial-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dial {
      position: relative;
      width: 32px;
      height: 32px;
      cursor: pointer;
    }
    .dial canvas {
      display: block;
    }

    /* ── Score bar ── */
    .score-bar {
      width: 100%;
      max-width: 800px;
      display: flex;
      gap: 20px;
      padding-bottom: 8px;
      font-size: 12px;
      color: var(--dim2);
    }
    #score       { color: var(--text); }
    #combo       { color: var(--mid); }
    #accuracy    { color: var(--dim3); }

    /* ── Beat indicator ── */
    .beat-indicator {
      width: 100%;
      max-width: 800px;
      display: flex;
      gap: 4px;
      padding-bottom: 6px;
      height: 14px;
      align-items: stretch;
    }
    .beat-indicator .beat-pip {
      flex: 1;
      border-radius: 2px;
      background: var(--control-bg);
      transition: background 0.05s;
    }
    .beat-indicator .beat-pip.active {
      background: var(--accent);
    }
    .beat-indicator .beat-pip.active.accent {
      background: var(--accent);
      box-shadow: 0 0 6px rgba(0, 255, 136, 0.4);
    }
    .beat-indicator .beat-pip.past {
      background: #1e2e1e;
    }

    /* ── Highway canvas ── */
    .highway-wrap {
      width: 100%;
      max-width: 800px;
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    #highway-canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ── Hit feedback ── */
    #hit-feedback {
      height: 32px;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
      color: var(--dim);
      text-align: center;
      transition: color 0.1s;
      line-height: 32px;
    }
    #hit-feedback.perfect { color: var(--perfect); }
    #hit-feedback.great   { color: var(--great); }
    #hit-feedback.good    { color: var(--good); }
    #hit-feedback.miss    { color: var(--miss); }

    /* ── Note buttons ── */
    .prompt {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--dim);
      margin-bottom: 8px;
      text-align: center;
    }

    .note-buttons {
      position: relative;
      display: flex;
      gap: 3px;
      width: 100%;
      max-width: 400px;
      height: 72px;
      margin: 0 auto 16px;
    }

    .note-btn {
      flex: 1;
      background: var(--control-bg);
      border: 1px solid var(--control-border);
      color: var(--mid);
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      border-radius: 0 0 6px 6px;
      cursor: pointer;
      letter-spacing: 0;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 5px;
    }
    .note-btn[data-black="true"] {
      position: absolute;
      top: 0;
      width: 12%;
      height: 55%;
      background: #111;
      border: 1px solid var(--control-border);
      color: var(--dim3);
      font-size: 11px;
      border-radius: 0 0 4px 4px;
      z-index: 1;
      align-items: flex-end;
      padding-bottom: 3px;
    }
    .note-btn[data-note="C#"] { left: 8.5%;  }
    .note-btn[data-note="D#"] { left: 22.5%; }
    .note-btn[data-note="F#"] { left: 51%;   }
    .note-btn[data-note="G#"] { left: 65%;   }
    .note-btn[data-note="A#"] { left: 79.5%; }
    .note-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--card-hover-bg); }
    .note-btn:active { background: #0f1a12; }

    .keyboard-hint {
      font-size: 9px;
      color: var(--dim);
      text-align: center;
      margin-top: -10px;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    /* ── Transport controls ── */
    .transport {
      display: flex;
      gap: 4px;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .transport-btn {
      background: #1e1e1e;
      border: 1px solid var(--control-border);
      color: var(--mid);
      font-family: inherit;
      font-size: 16px;
      width: 44px;
      height: 36px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
      padding: 0;
      line-height: 1;
    }
    .transport-btn:hover           { background: var(--control-border); color: var(--text); }
    .transport-btn:active          { background: var(--dim); }
    #btn-play.playing              { background: #0d1f14; color: var(--accent); border-color: var(--accent); }

    /* ── Results overlay ── */
    #results {
      display: none;
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      border: 1px solid var(--dim);
      border-radius: 12px;
      padding: 28px;
      text-align: center;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }
    #results.visible { display: block; }
    #results h2 {
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--accent);
      margin-bottom: 20px;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 12px;
      border-bottom: 1px solid var(--control-bg);
    }
    .result-row .label { color: var(--dim3); }
    .result-row .value { color: var(--text); }
    .result-row .value.perfect { color: var(--perfect); }
    .result-row .value.great { color: var(--great); }
    .result-row .value.good { color: var(--good); }
    .result-row .value.miss { color: var(--miss); }

    #results-close {
      margin-top: 20px;
      background: var(--control-bg);
      border: 1px solid var(--dim);
      color: var(--mid);
      font-family: inherit;
      font-size: 12px;
      padding: 8px 24px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 1px;
    }
    #results-close:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Backdrop ── */
    #backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 9;
    }
    #backdrop.visible { display: block; }

    /* ── Progress bar ── */
    .progress-wrap {
      width: 100%;
      max-width: 800px;
      height: 3px;
      background: var(--control-bg);
      border-radius: 2px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header class="page-header">
    <a class="back-link" href="./index.html">&larr; Back</a>
    <span class="page-title">MidiHero</span>
    <div class="input-status">
      <span id="midi-status">MIDI &mdash;</span>
      <select id="midi-device-select"><option>&mdash; no devices &mdash;</option></select>
      <a class="input-config-link" href="./input-config.html">&#9881;</a>
    </div>
  </header>

  <!-- ── Song selector + info ── -->
  <div class="song-bar">
    <label>Song: <select id="song-select"></select></label>
    <span id="song-bpm" class="bpm"></span>
    <span class="bar-sep">|</span>
    <label class="midi-upload-label" for="midi-upload">&#128190; Load .mid</label>
    <input type="file" id="midi-upload" accept=".mid,.midi" hidden />
    <span id="midi-upload-name" class="midi-file-name"></span>
    <select id="midi-track-select"></select>
    <div class="view-select-wrap">
      <span class="view-label">View:</span>
      <select id="view-select">
        <option value="piano">&#127929; Piano Roll</option>
        <option value="staff">&#119070; Staff</option>
        <option value="fingering">&#9835; Oboe Fingering</option>
      </select>
    </div>
  </div>

  <!-- ── Playback controls ── -->
  <div class="playback-bar">
    <label>Volume
      <input type="range" id="master-vol" class="vol-slider" min="0" max="100" value="50" />
    </label>
    <div class="dial-wrap">
      <span>Metronome</span>
      <div class="dial" id="met-dial" title="Metronome volume">
        <canvas width="32" height="32"></canvas>
      </div>
    </div>
  </div>

  <!-- ── Score ── -->
  <div class="score-bar">
    <span id="score">0</span>
    <span id="combo">combo 0</span>
    <span id="accuracy">0%</span>
  </div>

  <!-- ── Progress ── -->
  <div class="progress-wrap">
    <div id="progress-bar"></div>
  </div>

  <!-- ── Beat indicator ── -->
  <div class="beat-indicator" id="beat-indicator"></div>

  <!-- ── Highway ── -->
  <div class="highway-wrap">
    <canvas id="highway-canvas" width="800" height="360"></canvas>
  </div>

  <!-- ── Hit feedback ── -->
  <div id="hit-feedback"></div>

  <!-- ── Transport ── -->
  <div class="transport">
    <button class="transport-btn" id="btn-prev"           title="Restart">&#x23EE;</button>
    <button class="transport-btn" id="btn-next"           title="Skip forward one bar">&#x23ED;</button>
    <button class="transport-btn" id="btn-stop-transport" title="Stop">&#x23F9;</button>
    <button class="transport-btn" id="btn-play"           title="Play">&#x25B6;</button>
  </div>

  <p class="prompt">Play on MIDI keyboard &middot; sing/play into mic &middot; or click a note</p>
  <div class="note-buttons">
    <button class="note-btn" data-note="C">C</button>
    <button class="note-btn" data-note="C#" data-black="true">C&#9839;</button>
    <button class="note-btn" data-note="D">D</button>
    <button class="note-btn" data-note="D#" data-black="true">D&#9839;</button>
    <button class="note-btn" data-note="E">E</button>
    <button class="note-btn" data-note="F">F</button>
    <button class="note-btn" data-note="F#" data-black="true">F&#9839;</button>
    <button class="note-btn" data-note="G">G</button>
    <button class="note-btn" data-note="G#" data-black="true">G&#9839;</button>
    <button class="note-btn" data-note="A">A</button>
    <button class="note-btn" data-note="A#" data-black="true">A&#9839;</button>
    <button class="note-btn" data-note="B">B</button>
  </div>
  <p class="keyboard-hint">keys: a&nbsp;w&nbsp;s&nbsp;e&nbsp;d &nbsp; f&nbsp;t&nbsp;g&nbsp;y&nbsp;h&nbsp;u&nbsp;j</p>

  <!-- ── Results overlay ── -->
  <div id="backdrop"></div>
  <div id="results">
    <h2>Results</h2>
    <div class="result-row"><span class="label">Score</span><span class="value" id="r-score"></span></div>
    <div class="result-row"><span class="label">Accuracy</span><span class="value" id="r-accuracy"></span></div>
    <div class="result-row"><span class="label">Max Combo</span><span class="value" id="r-combo"></span></div>
    <div class="result-row"><span class="label">Perfect</span><span class="value perfect" id="r-perfect"></span></div>
    <div class="result-row"><span class="label">Great</span><span class="value great" id="r-great"></span></div>
    <div class="result-row"><span class="label">Good</span><span class="value good" id="r-good"></span></div>
    <div class="result-row"><span class="label">Miss</span><span class="value miss" id="r-miss"></span></div>
    <button id="results-close">Close</button>
  </div>

  <script type="module" src="./src/rhythm-main.js"></script>
</body>
</html>
